name: build-ax6000-110m-rollback

# 可选产物：110M 单 UBI 布局（immortalwrt-110m）的固件，
# 用于「想把机器切回旧的闭源驱动 110M 分区布局」时的回滚门票。
# 只有手动触发才会跑。

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: "0. 释放磁盘空间"
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: "1. 检出仓库"
        uses: actions/checkout@v4

      - name: "2. 安装编译依赖"
        run: |
          set -e
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 rsync unzip zlib1g-dev file wget ca-certificates \
            device-tree-compiler quilt bc time ccache

      - name: "3. 拉取闭源驱动线源码（25.12 / MTK mt_wifi）"
        run: |
          set -e
          git clone --depth 1 --branch 25.12 \
            https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: "4. 只保留 110M(mtkuboot) 机型"
        run: |
          set -e
          cd openwrt
          cp defconfig/mt7986-ax6000.config .config
          sed -i '/^CONFIG_TARGET_DEVICE_.*_DEVICE_/d' .config
          sed -i '/^CONFIG_TARGET_DEVICE_PACKAGES_/d' .config
          printf '%s\n' \
            'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-mtkuboot=y' \
            'CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-mtkuboot=""' \
            >> .config
          make defconfig
          echo "=== 机型核对 ==="
          grep -E "DEVICE_xiaomi_redmi-router-ax6000" .config
          grep -q "ax6000-mtkuboot=y" .config || { echo "::error::mtkuboot 机型未选中"; exit 1; }
          grep -q "CONFIG_PACKAGE_kmod-mt_wifi=y" .config && echo "  OK  闭源 mt_wifi 驱动已启用"
          echo "=== 布局核对（应为单 ubi 110m）==="
          grep -E 'label = "ubi"|reg = <0x600000' target/linux/mediatek/dts-ext/mt7986a-xiaomi-redmi-router-ax6000-mtkuboot.dts

      - name: "5. 记录版本清单"
        run: |
          set -e
          cd openwrt
          {
            echo "# 110M 回滚镜像版本清单 (UTC $(date -u +%FT%TZ))"
            echo "base:      chasey-dev/immortalwrt-mt798x-rebase 25.12 $(git rev-parse HEAD)"
            for d in feeds/packages feeds/luci; do
              [ -d "$d/.git" ] && echo "$(printf '%-10s' "${d##*/}") $(git -C $d rev-parse HEAD)"
            done
            echo "kernel:    $(grep -m1 '^KERNEL_PATCHVER' target/linux/mediatek/Makefile)"
          } | tee "$GITHUB_WORKSPACE/VERSIONS-110m.txt"

      - name: "6. 预下载源码包"
        continue-on-error: true
        run: cd openwrt && make download -j8

      - name: "7. 编译"
        run: |
          cd openwrt
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/build-110m.log"
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            make -j1 V=s 2>&1 | tee -a "$GITHUB_WORKSPACE/build-110m.log"
          fi

      - name: "8. 产物校验"
        run: |
          set -e
          cd openwrt/bin/targets/mediatek/filogic
          ls -lh *ax6000-mtkuboot* || { echo "::error::没有找到 mtkuboot 产物"; exit 1; }
          sha256sum *ax6000-mtkuboot* | tee "$GITHUB_WORKSPACE/SHA256SUMS-110m.txt"
          cp *ax6000-mtkuboot-squashfs-sysupgrade.bin "$GITHUB_WORKSPACE/"
          cp *ax6000-mtkuboot-factory.bin "$GITHUB_WORKSPACE/" 2>/dev/null || true

      - name: "9. 上传固件"
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12-ax6000-mtkuboot-110m
          if-no-files-found: error
          retention-days: 30
          path: |
            SHA256SUMS-110m.txt
            VERSIONS-110m.txt
            *ax6000-mtkuboot-squashfs-sysupgrade.bin
            *ax6000-mtkuboot-factory.bin

      - name: "10. 失败时上传日志"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failed-110m
          retention-days: 7
          path: build-110m.log
